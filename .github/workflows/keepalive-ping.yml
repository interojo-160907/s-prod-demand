name: Streamlit Ping

on:
  workflow_dispatch: {}
  schedule:
    # UTC 00:00, 08:00, 16:00 / KST 09:00, 17:00, 01:00
    - cron: "0 0,8,16 * * *"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app
        run: |
          curl -L -I --silent --show-error --max-time 30 "${{ secrets.STREAMLIT_URL }}"
