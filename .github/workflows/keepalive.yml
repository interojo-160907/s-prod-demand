name: Keep Streamlit Alive

on:
  workflow_dispatch: {}
  schedule:
    # Every 8 hours (UTC 00:00, 08:00, 16:00 / KST 09:00, 17:00, 01:00)
    - cron: "0 0,8,16 * * *"

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app
        run: |
          curl --location --silent --show-error --fail --max-time 30 "${{ secrets.STREAMLIT_URL }}"
